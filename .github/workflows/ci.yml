name: CI

# Gate every push/PR on: (1) the TypeScript typecheck, and (2) the PARITY TEST —
# the TS planners must produce exactly the same plan + validation decisions as the
# Python reference planners (reference/generate_*.py), which mirror the robot
# protocols. If the TS port ever drifts, this fails and blocks the merge.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Parity test (TS planners == Python reference)
        run: npm run parity
